name: Health
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out
          printf '## PR Health\n\n**SPOOFED: attacker-controlled artifact content**\n' > out/comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: out/
